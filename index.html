<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WORLD WIDE CAPITAL</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #2b2b2b, #1c1c1c);
      color: white;
    }

    header {
      background: linear-gradient(90deg, gold, #b8860b);
      color: black;
      text-align: center;
      padding: 25px;
      font-size: 28px;
      font-weight: bold;
    }

    .logo {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    form {
      background: #333;
      padding: 20px;
      border-radius: 10px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 5px;
    }

    button {
      background: gold;
      color: black;
      padding: 12px;
      border: none;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    button:hover {
      background: #d4af37;
    }

    .whatsapp {
      display: block;
      text-align: center;
      margin-top: 20px;
      background: #25D366;
      color: white;
      padding: 12px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      color: gold;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🚗💰</div>
  WORLD WIDE CAPITAL
</header>

<div class="container">

  <h2>Loan Application Form</h2>

  <form id="loanForm">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="number" id="age" placeholder="Age" required>
    <input type="text" id="id" placeholder="ID Number" required>
    <input type="text" id="phone" placeholder="Phone Number" required>
    <input type="email" value="worldwidecapital254@gmail.com" readonly>

    <select id="loanType" required>
      <option value="">Select Loan Type</option>
      <option>Logbook Loan</option>
      <option>Asset Financing</option>
    </select>

    <input type="number" id="amount" placeholder="Loan Amount Requested" required>

    <textarea id="message" placeholder="Additional Information"></textarea>

    <button type="submit">Submit Application</button>
  </form>

  <a class="whatsapp" href="https://wa.me/254738135250" target="_blank">
    Chat on WhatsApp
  </a>

</div>

<footer>
  Contact: +254 738 135250 | worldwidecapital254@gmail.com
</footer>

<script>
document.getElementById("loanForm").addEventListener("submit", function(e){
  e.preventDefault();

  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let id = document.getElementById("id").value;
  let phone = document.getElementById("phone").value;
  let loanType = document.getElementById("loanType").value;
  let amount = document.getElementById("amount").value;
  let message = document.getElementById("message").value;

  let text =
`NEW LOAN APPLICATION%0A
Name: ${name}%0A
Age: ${age}%0A
ID: ${id}%0A
Phone: ${phone}%0A
Loan Type: ${loanType}%0A
Amount: ${amount}%0A
Message: ${message}`;

  let whatsappURL = "https://wa.me/254738135250?text=" + text;

  window.open(whatsappURL, "_blank");
});
</script>

</body>
</html>
